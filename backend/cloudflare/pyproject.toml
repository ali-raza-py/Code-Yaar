[project]
name = "code-yaar-cloudflare-worker"
version = "0.1.0"
description = "Cloudflare Python Worker for the Code Yaar Django backend"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.1,<6.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.6",
    "django-storages[s3]>=1.14",
    "dj-database-url>=2.3",
    "psycopg>=3.2",
    "python-dotenv>=1.0",
    "Pillow==11.3.0",
    "reportlab>=5.1",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
